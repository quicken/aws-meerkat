AWSTemplateFormatVersion: 2010-09-09
Description: "Provisions the stack required by Meerkat the devops bot. Meerkat can be subscribed to SNS Topics and is especially usefull when listening for code pipeline life cycle events and cloudwatch alarms."

# devops-pipeline-monitor v2.0.0
Parameters:
  NameSpace:
    Type: String
    Description: "Resources that are not explicitly named are prefixed with this value. {NameSpace}meerkatbot"
    Default: "devops-"

  TableName:
    Type: String
    Description: "The name of the DynamoDb table that is used to track pipeline event."
    Default: meerkatbot

  CodeBucketName:
    Type: String
    Description: The S3 bucket that contains the lambda source code zip archive.

  CodeKey:
    Type: String
    Description: The S3 key to the zip file that contains the lambda source code. (no leading slash)
    Default: code-pipeline-monitor.v2.0.6.zip

  EnvGitProvider:
    Type: String
    AllowedValues:
      - bitbucket
      - github
    Description: "The service hosting the repository."
    Default: github

  EnvChatService:
    Type: String
    AllowedValues:
      - discord
      - slack
    Description: "The chat service used to deliver notifications."
    Default: discord

  EnvDeployArn:
    Type: String
    Description: "The role ARN assumed when retrieving CodeDeploy failure information across AWS accounts. Optional."
    Default: ""

  ApplicationLogLevel:
    Type: String
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: "Log level for application logs (console.debug, console.log, etc)."
    Default: INFO

  SystemLogLevel:
    Type: String
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
    Description: "Log level for Lambda runtime logs (INIT_START, REPORT, etc)."
    Default: INFO

  CostCenter:
    Type: String
    Description: "The value applied to the costcenter tag."
    Default: meerkatbot

  AllowedSourceAccounts:
    Type: CommaDelimitedList
    Description: "Comma-separated list of AWS account IDs allowed to publish cross-account notifications to Meerkat's SNS topic."
    Default: ""

Resources:
  MeerkatConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /meerkat/config
      Type: String
      Value: |
        {
          "accounts": {},
          "slack": {
            "routes": [{
              "expression": "type:PipelineNotification&name~^meerkat.*-prd$",
              "channel": "#meerkat"
            }]
          }
        }
      Description: Meerkat configuration (accounts, routing rules)
      Tags:
        costcenter: !Ref CostCenter

  DBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: executionId
          AttributeType: S
      KeySchema:
        - AttributeName: executionId
          KeyType: HASH
      TableName: !Ref TableName
      Tags:
        - Key: costcenter
          Value: !Ref CostCenter

  SnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${NameSpace}meerkatbot"
        - Key: costcenter
          Value: !Ref CostCenter

  SnsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Statement:
          - Sid: ServicesInOwningAccount
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - SNS:GetTopicAttributes
              - SNS:SetTopicAttributes
              - SNS:AddPermission
              - SNS:RemovePermission
              - SNS:DeleteTopic
              - SNS:Subscribe
              - SNS:ListSubscriptionsByTopic
              - SNS:Publish
              - SNS:Receive
            Resource: !Ref SnsTopic
            Condition:
              StringEquals:
                AWS:SourceOwner: !Ref AWS::AccountId

          - Sid: AWSCodeStarNotifications
            Effect: Allow
            Principal:
              Service: codestar-notifications.amazonaws.com
            Action:
              - SNS:Publish
            Resource: !Ref SnsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
          - Sid: CrossAccountCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: "SNS:Publish"
            Resource: !Ref SnsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AllowedSourceAccounts
          - Sid: CrossAccountCodeStarNotifications
            Effect: Allow
            Principal:
              Service: codestar-notifications.amazonaws.com
            Action: "SNS:Publish"
            Resource: !Ref SnsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AllowedSourceAccounts
          - Sid: CrossAccountSNSForward
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: "SNS:Publish"
            Resource: !Ref SnsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AllowedSourceAccounts
      Topics:
        - !Ref SnsTopic

  LambdaServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Service:
                - lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Description: "This service role is assumed by the pipeline-monitor Lambdas."
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      RoleName: !Sub "${NameSpace}meerkatbot"
      Tags:
        - Key: costcenter
          Value: !Ref CostCenter

  LambdaServicePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${NameSpace}meerkatbot"
      Description: "This policy grants the permissions required by the meerkat bot."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DynamoDb
            # Permission to use a Dynamo DB Table to track pipeline lifecycle events.
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
            Effect: Allow
            Resource: !GetAtt DBTable.Arn

          - Sid: SSMParameters
            # Permission to read SSM parameters for Meerkat configuration (SecureString)
            Action:
              - ssm:GetParameter
            Effect: Allow
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/meerkat/config"

          - Sid: CodeBuild
            # Permission to retrieve aditional information from builds.
            Effect: Allow
            Action:
              - codebuild:BatchGetBuilds
            Resource:
              - "*"

          - Sid: CodeDeploy
            # Permission to retrieve aditional information from deployments.
            Effect: Allow
            Action:
              - codedeploy:BatchGetDeploymentTargets
              - codedeploy:ListDeploymentTargets
            Resource:
              - "*"

          - Sid: CodePipeline
            # Permission to retrieve S3 source object key from pipeline action executions.
            Effect: Allow
            Action:
              - codepipeline:ListActionExecutions
            Resource:
              - "*"
          - Sid: FetchCodeFromS3
            # Permission to retrieve source code from S3.
            Action:
              - s3:GetObject
            Effect: Allow
            Resource: !Sub "arn:aws:s3:::${CodeBucketName}/*"
      Roles:
        - !Ref LambdaServiceRole

  MeerkatLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NameSpace}meerkatbot"
      Description: "Meerkat forwards SNS messages to Discord or Slack. Meerkat will enrich messages received from GitHub, Bitbucket, Cloudwatch, Code Build, Code Pipeline and Code Deploy to assist troubleshooting issues. The lambda must be subscribed to a SNS Topic."
      Handler: "index.handler"
      Environment:
        Variables:
          CHAT_SERVICE: !Ref EnvChatService
          GIT_PROVIDER: !Ref EnvGitProvider
          DB_TABLE: !Ref DBTable
          DEPLOY_ARN: !Ref EnvDeployArn
          MEERKAT_CONFIG_PARAM: /meerkat/config
      PackageType: Zip
      Role: !GetAtt LambdaServiceRole.Arn
      Runtime: nodejs22.x
      Timeout: 15
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: !Ref ApplicationLogLevel
        SystemLogLevel: !Ref SystemLogLevel
      Code:
        S3Bucket: !Ref CodeBucketName
        S3Key: !Ref CodeKey
      Tags:
        - Key: costcenter
          Value: !Ref CostCenter

  MeerkatLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MeerkatLambda
      Principal: sns.amazonaws.com
      SourceArn: !Ref SnsTopic

  SnsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      Endpoint: !GetAtt MeerkatLambda.Arn
      TopicArn: !Ref SnsTopic

Outputs:
  TopicArn:
    Description: "The ARN of the topic that can be used to receive code pipeline life cycle events."
    Value: !Ref SnsTopic
    Export:
      Name: !Sub "${AWS::StackName}-pipeline-monitor-topic"

  PipeLineLambdaArn:
    Description: "The ARN of the pipeline-monitor lambda."
    Value: !GetAtt MeerkatLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-pipeline-monitor-lambda"
